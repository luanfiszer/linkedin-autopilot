<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="sans-serif">
  <rect width="1600" height="900" fill="#F3EEE4"/>
  <text x="80" y="95" font-size="52" font-weight="700" fill="#1F2A2C">Separar dado de instrução no prompt</text>
  <text x="80" y="145" font-size="28" fill="#6B6358">Tradutor do meu projeto pessoal: 90 execuções antes, 90 depois de uma mudança no prompt.</text>

  <!-- card ANTES -->
  <rect x="80" y="200" width="680" height="420" rx="16" fill="#FFFDF8" stroke="#D9CFBF" stroke-width="3"/>
  <text x="120" y="260" font-size="30" font-weight="700" fill="#C0563B">ANTES</text>
  <text x="120" y="365" font-size="92" font-weight="700" fill="#C0563B">10 / 90</text>
  <text x="120" y="415" font-size="26" fill="#1F2A2C">execuções erradas (11%)</text>
  <text x="120" y="470" font-size="22" fill="#6B6358">Respondia à pergunta do</text>
  <text x="120" y="500" font-size="22" fill="#6B6358">professor virtual, em inglês,</text>
  <text x="120" y="530" font-size="22" fill="#6B6358">em vez de traduzir ela.</text>

  <!-- card DEPOIS -->
  <rect x="840" y="200" width="680" height="420" rx="16" fill="#FFFDF8" stroke="#D9CFBF" stroke-width="3"/>
  <text x="880" y="260" font-size="30" font-weight="700" fill="#3E7C78">DEPOIS</text>
  <text x="880" y="365" font-size="92" font-weight="700" fill="#3E7C78">0 / 90</text>
  <text x="880" y="415" font-size="26" fill="#1F2A2C">execuções erradas</text>
  <text x="880" y="470" font-size="22" fill="#6B6358">O texto do professor passou a</text>
  <text x="880" y="500" font-size="22" fill="#6B6358">entrar delimitado por marcas:</text>
  <text x="880" y="530" font-size="22" fill="#6B6358">dado, nunca instrução.</text>

  <!-- trecho monoespaçado -->
  <rect x="400" y="650" width="800" height="150" rx="12" fill="#FFFDF8" stroke="#D9CFBF" stroke-width="2"/>
  <text x="440" y="697" font-family="monospace" font-size="26" fill="#2F4A4F">&lt;&lt;&lt;TRADUZIR</text>
  <text x="440" y="733" font-family="monospace" font-size="26" fill="#1F2A2C">{fala do professor}</text>
  <text x="440" y="769" font-family="monospace" font-size="26" fill="#2F4A4F">TRADUZIR&gt;&gt;&gt;</text>

  <text x="800" y="830" font-size="24" fill="#1F2A2C" text-anchor="middle">Pergunta entre as marcas é traduzida, não respondida. Duas rodadas de teste: US$ 0,063.</text>
</svg>
