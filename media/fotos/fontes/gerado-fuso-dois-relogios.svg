<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="sans-serif">
  <rect width="1600" height="900" fill="#F3EEE4"/>
  <rect x="0" y="0" width="1600" height="90" fill="#E6DDCD"/>
  <defs>
    <g id="marcas" stroke="#2F4A4F" stroke-linecap="round">
      <line x1="0" y1="-190" x2="0" y2="-165" stroke-width="8"/>
      <line x1="0" y1="-190" x2="0" y2="-165" stroke-width="8" transform="rotate(90)"/>
      <line x1="0" y1="-190" x2="0" y2="-165" stroke-width="8" transform="rotate(180)"/>
      <line x1="0" y1="-190" x2="0" y2="-165" stroke-width="8" transform="rotate(270)"/>
      <g stroke-width="4">
        <line x1="0" y1="-190" x2="0" y2="-175" transform="rotate(30)"/><line x1="0" y1="-190" x2="0" y2="-175" transform="rotate(60)"/>
        <line x1="0" y1="-190" x2="0" y2="-175" transform="rotate(120)"/><line x1="0" y1="-190" x2="0" y2="-175" transform="rotate(150)"/>
        <line x1="0" y1="-190" x2="0" y2="-175" transform="rotate(210)"/><line x1="0" y1="-190" x2="0" y2="-175" transform="rotate(240)"/>
        <line x1="0" y1="-190" x2="0" y2="-175" transform="rotate(300)"/><line x1="0" y1="-190" x2="0" y2="-175" transform="rotate(330)"/>
      </g>
    </g>
  </defs>
  <line x1="480" y1="90" x2="480" y2="220" stroke="#6B5A40" stroke-width="4"/>
  <line x1="1120" y1="90" x2="1120" y2="220" stroke="#6B5A40" stroke-width="4"/>
  <!-- relógio UTC: 11:00 -->
  <g transform="translate(480 440)">
    <circle r="220" fill="#2F4A4F"/><circle r="200" fill="#FFFDF8"/>
    <use href="#marcas"/>
    <line x1="0" y1="0" x2="0" y2="-150" stroke="#2F4A4F" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="-100" stroke="#2F4A4F" stroke-width="14" stroke-linecap="round" transform="rotate(330)"/>
    <circle r="12" fill="#C0563B"/>
  </g>
  <!-- relógio -03:00: 08:00 -->
  <g transform="translate(1120 440)">
    <circle r="220" fill="#3E7C78"/><circle r="200" fill="#FFFDF8"/>
    <use href="#marcas"/>
    <line x1="0" y1="0" x2="0" y2="-150" stroke="#2F4A4F" stroke-width="8" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="0" y2="-100" stroke="#2F4A4F" stroke-width="14" stroke-linecap="round" transform="rotate(240)"/>
    <circle r="12" fill="#C0563B"/>
  </g>
  <g font-size="44" font-weight="700" text-anchor="middle">
    <rect x="405" y="700" width="150" height="64" rx="10" fill="#2F4A4F"/><text x="480" y="748" fill="#F3EEE4">UTC</text>
    <rect x="1035" y="700" width="170" height="64" rx="10" fill="#3E7C78"/><text x="1120" y="748" fill="#F3EEE4">-03:00</text>
  </g>
  <text x="800" y="850" font-size="34" fill="#6B6358" text-anchor="middle">mesmo instante, dois relógios</text>
</svg>
