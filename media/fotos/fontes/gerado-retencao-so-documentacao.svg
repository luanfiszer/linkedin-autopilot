<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="sans-serif">
  <rect width="1600" height="900" fill="#F3EEE4"/>
  <text x="80" y="95" font-size="50" font-weight="700" fill="#1F2A2C">Política que não falha quando ausente é só sugestão</text>
  <text x="80" y="135" font-size="24" fill="#6B6358">Regra de retenção escrita e testada, mas nenhum código de produção aplicava.</text>

  <rect x="80" y="200" width="680" height="50" rx="10" fill="#C0563B"/>
  <text x="420" y="233" font-size="26" font-weight="700" fill="#FFFDF8" text-anchor="middle">SÓ DOCUMENTAÇÃO</text>
  <rect x="840" y="200" width="680" height="50" rx="10" fill="#3E7C78"/>
  <text x="1180" y="233" font-size="26" font-weight="700" fill="#FFFDF8" text-anchor="middle">POLÍTICA DE VERDADE</text>

  <g font-size="22">
    <rect x="80" y="280" width="680" height="78" rx="12" fill="#FFFDF8" stroke="#D9CFBF" stroke-width="3"/>
    <text x="420" y="326" text-anchor="middle" fill="#1F2A2C">Regra de TTL escrita e testada</text>

    <rect x="80" y="376" width="680" height="78" rx="12" fill="#FFFDF8" stroke="#D9CFBF" stroke-width="3"/>
    <text x="420" y="422" text-anchor="middle" fill="#1F2A2C">Nenhum código de produção aplica</text>

    <rect x="80" y="472" width="680" height="78" rx="12" fill="#FFFDF8" stroke="#D9CFBF" stroke-width="3"/>
    <text x="420" y="518" text-anchor="middle" fill="#1F2A2C">Lifecycle local nem existe</text>

    <rect x="80" y="568" width="680" height="78" rx="12" fill="#C0563B"/>
    <text x="420" y="606" text-anchor="middle" font-weight="700" fill="#FFFDF8">Grava pra sempre</text>
    <text x="420" y="634" text-anchor="middle" fill="#FFFDF8">sem erro nenhum</text>
  </g>
  <g stroke="#C0563B" stroke-width="5" stroke-linecap="round">
    <path d="M420 358 V372"/><path d="M420 454 V468"/><path d="M420 550 V564"/>
  </g>
  <g fill="#C0563B">
    <path d="M407 372 l13 14 l13 -14 Z"/><path d="M407 468 l13 14 l13 -14 Z"/><path d="M407 564 l13 14 l13 -14 Z"/>
  </g>

  <g font-size="22">
    <rect x="840" y="280" width="680" height="78" rx="12" fill="#FFFDF8" stroke="#D9CFBF" stroke-width="3"/>
    <text x="1180" y="326" text-anchor="middle" fill="#1F2A2C">Comando de operador aplica (idempotente)</text>

    <rect x="840" y="376" width="680" height="78" rx="12" fill="#FFFDF8" stroke="#D9CFBF" stroke-width="3"/>
    <text x="1180" y="422" text-anchor="middle" fill="#1F2A2C">Worker confere a config no boot</text>

    <rect x="840" y="472" width="680" height="78" rx="12" fill="#FFFDF8" stroke="#D9CFBF" stroke-width="3"/>
    <text x="1180" y="518" text-anchor="middle" fill="#1F2A2C">Ausente ou divergente: recusa subir</text>

    <rect x="840" y="568" width="680" height="78" rx="12" fill="#3E7C78"/>
    <text x="1180" y="606" text-anchor="middle" font-weight="700" fill="#FFFDF8">Falha alto</text>
    <text x="1180" y="634" text-anchor="middle" fill="#FFFDF8">mensagem diz qual comando rodar</text>
  </g>
  <g stroke="#3E7C78" stroke-width="5" stroke-linecap="round">
    <path d="M1180 358 V372"/><path d="M1180 454 V468"/><path d="M1180 550 V564"/>
  </g>
  <g fill="#3E7C78">
    <path d="M1167 372 l13 14 l13 -14 Z"/><path d="M1167 468 l13 14 l13 -14 Z"/><path d="M1167 564 l13 14 l13 -14 Z"/>
  </g>

  <rect x="80" y="690" width="1440" height="130" rx="14" fill="#FFFDF8" stroke="#D9CFBF" stroke-width="3"/>
  <text x="105" y="730" font-size="22" font-weight="700" fill="#6B6358">a opinião</text>
  <text x="105" y="766" font-size="22" fill="#1F2A2C">função testada que ninguém chama é só documentação.</text>
  <text x="105" y="796" font-size="22" fill="#1F2A2C">política obrigatória tem que falhar alto quando não está valendo.</text>
</svg>
