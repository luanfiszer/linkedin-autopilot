<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="sans-serif">
  <rect width="1600" height="900" fill="#F3EEE4"/>
  <text x="80" y="95" font-size="52" font-weight="700" fill="#1F2A2C">O remendo não pode tocar o dado persistido</text>
  <text x="80" y="145" font-size="28" fill="#6B6358">Checagem redundante enquanto um serviço de fora corrigia um veredito inconsistente.</text>

  <!-- card ERRADO -->
  <rect x="80" y="200" width="680" height="430" rx="16" fill="#FFFDF8" stroke="#D9CFBF" stroke-width="3"/>
  <text x="120" y="258" font-size="30" font-weight="700" fill="#C0563B">ERRADO</text>

  <circle cx="145" cy="320" r="22" fill="#C0563B"/><text x="145" y="329" text-anchor="middle" fill="#FFFDF8" font-size="22" font-weight="700">1</text>
  <text x="185" y="312" font-size="23" fill="#1F2A2C">Marca o campo direto</text>
  <text x="185" y="340" font-size="23" fill="#1F2A2C">no registro gravado</text>

  <circle cx="145" cy="410" r="22" fill="#C0563B"/><text x="145" y="419" text-anchor="middle" fill="#FFFDF8" font-size="22" font-weight="700">2</text>
  <text x="185" y="402" font-size="23" fill="#1F2A2C">Pra desfazer depois,</text>
  <text x="185" y="430" font-size="23" fill="#1F2A2C">precisa de migração</text>

  <rect x="120" y="470" width="600" height="130" rx="10" fill="#1F2A2C"/>
  <text x="145" y="512" font-family="monospace" font-size="22" fill="#F3EEE4">registro.veredito = regra(registro)</text>
  <text x="145" y="546" font-family="monospace" font-size="22" fill="#F3EEE4">salvar(registro)</text>
  <text x="145" y="580" font-family="monospace" font-size="20" fill="#C9A07A">// dado de entrada sumiu</text>

  <!-- card CERTO -->
  <rect x="840" y="200" width="680" height="430" rx="16" fill="#FFFDF8" stroke="#D9CFBF" stroke-width="3"/>
  <text x="880" y="258" font-size="30" font-weight="700" fill="#3E7C78">CERTO</text>

  <circle cx="905" cy="320" r="22" fill="#3E7C78"/><text x="905" y="329" text-anchor="middle" fill="#FFFDF8" font-size="22" font-weight="700">1</text>
  <text x="945" y="312" font-size="23" fill="#1F2A2C">Grava o dado de entrada</text>
  <text x="945" y="340" font-size="23" fill="#1F2A2C">puro, intacto, pra auditoria</text>

  <circle cx="905" cy="410" r="22" fill="#3E7C78"/><text x="905" y="419" text-anchor="middle" fill="#FFFDF8" font-size="22" font-weight="700">2</text>
  <text x="945" y="402" font-size="23" fill="#1F2A2C">Regra decide na leitura,</text>
  <text x="945" y="430" font-size="23" fill="#1F2A2C">num Calculator isolado</text>

  <rect x="880" y="470" width="600" height="130" rx="10" fill="#1F2A2C"/>
  <text x="905" y="512" font-family="monospace" font-size="22" fill="#F3EEE4">status = Calculator.decidir(entrada)</text>
  <text x="905" y="546" font-family="monospace" font-size="20" fill="#9FD6CE">// entrada nunca é alterada</text>

  <text x="800" y="690" font-size="26" fill="#1F2A2C" text-anchor="middle" font-weight="700">Pra desfazer: apaga uma classe. Um commit. Sem migração.</text>
</svg>
