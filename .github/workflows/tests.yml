name: Testes

on:
  push:
    branches: [main]
    paths: ["scripts/**", "tests/**", ".claude/skills/li-human/**", "requirements*.txt"]
  pull_request:
    paths: ["scripts/**", "tests/**", ".claude/skills/li-human/**", "requirements*.txt"]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
