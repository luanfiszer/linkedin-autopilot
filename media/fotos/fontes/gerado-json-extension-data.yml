titulo: Round-trip sem preservar o desconhecido
caixas:
  - Dois processos gravam o mesmo JSON
  - Um lê o JSON pra uma classe tipada
  - Regrava só os campos que a classe conhece
  - Campo do outro processo some, sem erro
setas:
  - cada um grava um campo
  - só os campos declarados
  - round-trip
destaque: 3
nota: "JsonExtensionData preserva o que a classe não conhece."
