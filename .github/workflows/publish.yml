name: Publicar no LinkedIn

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: linkedin-publish
  cancel-in-progress: false

jobs:
  publish:
    # Só publica o que está na main, ou seja, o que chegou por merge.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Publicar o próximo post vencido
        id: publish
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_VERSION: ${{ vars.LINKEDIN_VERSION }}
        run: |
          set +e
          python scripts/li_publish.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      # Commita mesmo em publicação incerta (código 4): o marcador
      # publish_attempted_at precisa ficar na main para impedir nova tentativa.
      - name: Commitar movimentação da fila e log
        env:
          SLUG: ${{ steps.publish.outputs.published_slug }}
        run: |
          git add -A queue linkedin
          if git diff --cached --quiet; then
            echo "Nada mudou na fila."
            exit 0
          fi
          if [ -z "$SLUG" ]; then
            SLUG=$(git diff --cached --name-only -- queue | grep '\.md$' | head -1 | xargs -r basename | sed 's/\.md$//')
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: publish ${SLUG:-queue}"
          for i in 1 2 3; do
            git pull --rebase --quiet origin main && git push origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          echo "::error::Não consegui dar push da movimentação da fila."
          exit 1

      - name: Abrir ou atualizar issue de token expirado
        if: steps.publish.outputs.exit_code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Token do LinkedIn expirou"
          BODY="O publicador recebeu 401/403 do LinkedIn em $(date -u +'%Y-%m-%d %H:%M UTC').

          Para resolver:
          1. Rode \`python scripts/get_token.py\` no seu computador.
          2. Atualize o secret \`LINKEDIN_ACCESS_TOKEN\` (e \`LINKEDIN_PERSON_URN\`, se mudou).
          3. Rode o workflow \"Publicar no LinkedIn\" manualmente (Actions > Run workflow).

          Nenhum post foi perdido: eles continuam em \`queue/approved/\` e saem na próxima execução.

          Execução: $RUN_URL"
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
                --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Ainda falhando: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Fechar issue de token se voltou a publicar
        if: steps.publish.outputs.exit_code == '0' && steps.publish.outputs.published_slug != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Token do LinkedIn expirou"
          for NUM in $(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
                       --jq ".[] | select(.title == \"$TITLE\") | .number"); do
            gh issue close "$NUM" --comment "Publicação voltou a funcionar."
          done

      - name: Abrir issue de publicação incerta
        if: steps.publish.outputs.exit_code == '4'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="Publicação incerta no LinkedIn"
          BODY="O LinkedIn não respondeu direito (timeout ou erro 5xx) ao publicar um post, e não dá pra saber se ele saiu.
          O arquivo ficou em \`queue/approved/\` com \`publish_attempted_at\` e **não será tentado de novo sozinho**.

          1. Olhe o seu perfil no LinkedIn.
          2. Se o post saiu: adicione \`posted_urn: \"urn:li:share:...\"\` no frontmatter (o URN está na URL do post). O próximo run move o arquivo.
          3. Se não saiu: apague a linha \`publish_attempted_at\` e o post sai no próximo run.

          Execução: $RUN_URL"
          NUM=$(gh issue list --state open --search "in:title \"$TITLE\"" --json number,title \
                --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --body "Aconteceu de novo: $RUN_URL"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

      - name: Falhar o job se a publicação falhou
        if: steps.publish.outputs.exit_code != '0'
        run: |
          echo "::error::li_publish.py saiu com código ${{ steps.publish.outputs.exit_code }}. Veja o log do passo 'Publicar'."
          exit 1
