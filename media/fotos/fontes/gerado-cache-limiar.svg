<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" font-family="sans-serif">
  <rect width="1600" height="900" fill="#F3EEE4"/>
  <rect x="0" y="760" width="1600" height="140" fill="#E6DDCD"/>
  <!-- régua de altura -->
  <rect x="560" y="110" width="120" height="650" rx="8" fill="#2F4A4F"/>
  <g stroke="#F3EEE4" stroke-width="4">
    <line x1="560" y1="160" x2="610" y2="160"/><line x1="560" y1="225" x2="595" y2="225"/><line x1="560" y1="290" x2="610" y2="290"/>
    <line x1="560" y1="355" x2="595" y2="355"/><line x1="560" y1="420" x2="610" y2="420"/><line x1="560" y1="485" x2="595" y2="485"/>
    <line x1="560" y1="550" x2="610" y2="550"/><line x1="560" y1="615" x2="595" y2="615"/><line x1="560" y1="680" x2="610" y2="680"/>
  </g>
  <!-- linha do mínimo -->
  <line x1="680" y1="200" x2="1300" y2="200" stroke="#C0563B" stroke-width="6" stroke-dasharray="22 14" stroke-linecap="round"/>
  <text x="720" y="175" font-size="40" font-weight="700" fill="#C0563B">mínimo pro cache engatar: 4.096 tokens</text>
  <!-- pilha de blocos: uma conversa real -->
  <g stroke="#6B4E2E" stroke-width="3">
    <rect x="800" y="690" width="220" height="70" rx="6" fill="#C99A63"/>
    <rect x="815" y="620" width="190" height="70" rx="6" fill="#D2A873"/>
    <rect x="835" y="550" width="150" height="70" rx="6" fill="#C99A63"/>
  </g>
  <line x1="1010" y1="550" x2="1070" y2="480" stroke="#3E4A4C" stroke-width="3"/>
  <text x="1080" y="478" font-size="36" fill="#3E4A4C">uma conversa real do app</text>
  <!-- distância -->
  <line x1="910" y1="530" x2="910" y2="225" stroke="#9AA6A8" stroke-width="4" stroke-dasharray="6 12" stroke-linecap="round"/>
  <path d="M894 245 l16 -22 l16 22" fill="none" stroke="#9AA6A8" stroke-width="4" stroke-linecap="round"/>
</svg>
