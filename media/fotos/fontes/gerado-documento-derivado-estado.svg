<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="sans-serif">
  <rect width="1600" height="900" fill="#F3EEE4"/>
  <text x="80" y="95" font-size="50" font-weight="700" fill="#1F2A2C">Documento derivado também guardava estado</text>
  <text x="80" y="140" font-size="25" fill="#6B6358">Job noturno reconstruía um JSON do zero; um campo (o progresso) só existia ali.</text>

  <!-- cabeçalhos -->
  <rect x="80" y="190" width="680" height="50" rx="10" fill="#C0563B"/>
  <text x="420" y="223" font-size="25" font-weight="700" fill="#FFFDF8" text-anchor="middle">O QUE QUEBRAVA</text>
  <rect x="840" y="190" width="680" height="50" rx="10" fill="#3E7C78"/>
  <text x="1180" y="223" font-size="25" font-weight="700" fill="#FFFDF8" text-anchor="middle">A CORREÇÃO</text>

  <!-- coluna quebra -->
  <g font-size="21">
    <rect x="80" y="266" width="680" height="72" rx="12" fill="#FFFDF8" stroke="#D9CFBF" stroke-width="3"/>
    <text x="420" y="300" text-anchor="middle" fill="#1F2A2C">Job reconstrói o documento</text>
    <text x="420" y="326" text-anchor="middle" fill="#1F2A2C">do zero, toda madrugada</text>

    <rect x="80" y="356" width="680" height="72" rx="12" fill="#FFFDF8" stroke="#D9CFBF" stroke-width="3"/>
    <text x="420" y="390" text-anchor="middle" fill="#1F2A2C">O progresso só existe</text>
    <text x="420" y="416" text-anchor="middle" fill="#1F2A2C">dentro desse documento</text>

    <rect x="80" y="446" width="680" height="72" rx="12" fill="#FFFDF8" stroke="#D9CFBF" stroke-width="3"/>
    <text x="420" y="480" text-anchor="middle" fill="#1F2A2C">Documento novo substitui</text>
    <text x="420" y="506" text-anchor="middle" fill="#1F2A2C">o antigo. Progresso zera</text>

    <rect x="80" y="536" width="680" height="90" rx="12" fill="#C0563B"/>
    <text x="420" y="572" text-anchor="middle" font-weight="700" fill="#FFFDF8">Outra rotina usa o campo</text>
    <text x="420" y="598" text-anchor="middle" fill="#FFFDF8">como teto: zero vira "avanço"</text>
  </g>
  <g stroke="#C0563B" stroke-width="5" stroke-linecap="round">
    <path d="M420 338 V352"/>
    <path d="M420 428 V442"/>
    <path d="M420 518 V532"/>
  </g>
  <g fill="#C0563B">
    <path d="M407 352 l13 14 l13 -14 Z"/>
    <path d="M407 442 l13 14 l13 -14 Z"/>
    <path d="M407 532 l13 14 l13 -14 Z"/>
  </g>

  <!-- coluna correção -->
  <g font-size="21">
    <rect x="840" y="266" width="680" height="72" rx="12" fill="#FFFDF8" stroke="#D9CFBF" stroke-width="3"/>
    <text x="1180" y="300" text-anchor="middle" fill="#1F2A2C">Job reconstrói o documento</text>
    <text x="1180" y="326" text-anchor="middle" fill="#1F2A2C">do zero, toda madrugada</text>

    <rect x="840" y="356" width="680" height="72" rx="12" fill="#FFFDF8" stroke="#D9CFBF" stroke-width="3"/>
    <text x="1180" y="390" text-anchor="middle" fill="#1F2A2C">Antes de salvar, mescla o</text>
    <text x="1180" y="416" text-anchor="middle" fill="#1F2A2C">estado anterior no novo</text>

    <rect x="840" y="446" width="680" height="72" rx="12" fill="#FFFDF8" stroke="#D9CFBF" stroke-width="3"/>
    <text x="1180" y="480" text-anchor="middle" fill="#1F2A2C">Merge pela chave (id), com</text>
    <text x="1180" y="506" text-anchor="middle" fill="#1F2A2C">fallback pelo nome</text>

    <rect x="840" y="536" width="680" height="90" rx="12" fill="#3E7C78"/>
    <text x="1180" y="572" text-anchor="middle" font-weight="700" fill="#FFFDF8">Progresso nunca zera sem</text>
    <text x="1180" y="598" text-anchor="middle" fill="#FFFDF8">motivo. Regressão não vaza</text>
  </g>
  <g stroke="#3E7C78" stroke-width="5" stroke-linecap="round">
    <path d="M1180 338 V352"/>
    <path d="M1180 428 V442"/>
    <path d="M1180 518 V532"/>
  </g>
  <g fill="#3E7C78">
    <path d="M1167 352 l13 14 l13 -14 Z"/>
    <path d="M1167 442 l13 14 l13 -14 Z"/>
    <path d="M1167 532 l13 14 l13 -14 Z"/>
  </g>

  <!-- nota -->
  <rect x="80" y="660" width="1440" height="150" rx="14" fill="#FFFDF8" stroke="#D9CFBF" stroke-width="3"/>
  <text x="105" y="700" font-size="23" font-weight="700" fill="#6B6358">conceito: "reconstruir da fonte" só vale se o documento for 100% derivado</text>
  <text x="105" y="736" font-size="23" fill="#1F2A2C">Se uma parte dele guarda um estado que não existe em nenhum outro lugar, reconstruir</text>
  <text x="105" y="768" font-size="23" fill="#1F2A2C">do zero apaga aquele estado, mesmo que o resto do documento seja mesmo derivado.</text>
</svg>
