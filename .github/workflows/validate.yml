name: Validar fila

on:
  pull_request:
    paths:
      - "queue/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Validar posts novos em queue/approved/
        run: python scripts/validate_queue.py --base "origin/${{ github.base_ref }}"
