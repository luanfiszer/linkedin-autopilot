titulo: A corrida que dois curl em paralelo revelou
caixas: [Dois refresh ao mesmo tempo, "Lê, confere, revoga: 3 passos", "UPDATE atômico WHERE revoked_at IS NULL", "Só 1 aba renova (Web Locks API)"]
