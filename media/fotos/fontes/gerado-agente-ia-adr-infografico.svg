<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" font-family="sans-serif">
  <rect width="1600" height="900" fill="#F3EEE4"/>
  <text x="80" y="95" font-size="52" font-weight="700" fill="#1F2A2C">O agente de IA não lembra. O documento lembra.</text>
  <text x="80" y="145" font-size="28" fill="#6B6358">Cada sessão nova enxerga só o código, não o raciocínio por trás dele.</text>

  <!-- sem registro -->
  <rect x="80" y="195" width="520" height="560" rx="16" fill="#FFFDF8" stroke="#D9CFBF" stroke-width="3"/>
  <text x="115" y="247" font-size="28" font-weight="700" fill="#C0563B">Regra só na cabeça</text>

  <rect x="115" y="280" width="450" height="110" rx="12" fill="#F3EEE4"/>
  <text x="140" y="322" font-size="24" font-weight="700" fill="#1F2A2C">Sessão de ontem</text>
  <text x="140" y="358" font-size="22" fill="#6B6358">combina uma regra de arquitetura</text>

  <path d="M340 400 V440" stroke="#9AA6A8" stroke-width="5" stroke-linecap="round"/>
  <path d="M326 428 l14 16 l14 -16" fill="none" stroke="#9AA6A8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="115" y="455" width="450" height="110" rx="12" fill="#F3EEE4"/>
  <text x="140" y="497" font-size="24" font-weight="700" fill="#1F2A2C">Sessão de hoje</text>
  <text x="140" y="533" font-size="22" fill="#6B6358">vê só o código, não o combinado</text>

  <path d="M340 575 V615" stroke="#C0563B" stroke-width="5" stroke-linecap="round"/>
  <path d="M326 603 l14 16 l14 -16" fill="none" stroke="#C0563B" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <rect x="115" y="630" width="450" height="95" rx="12" fill="#C0563B"/>
  <path d="M145 660 l34 34 M179 660 l-34 34" stroke="#FFFDF8" stroke-width="7" stroke-linecap="round"/>
  <text x="200" y="672" font-size="24" font-weight="700" fill="#FFFDF8">Desfaz o que</text>
  <text x="200" y="704" font-size="24" font-weight="700" fill="#FFFDF8">a anterior decidiu</text>

  <!-- o que mudou -->
  <rect x="640" y="195" width="880" height="560" rx="16" fill="#2F4A4F"/>
  <text x="680" y="247" font-size="28" font-weight="700" fill="#FFFDF8">O que mudou, na prática</text>

  <g font-size="24">
    <rect x="680" y="280" width="330" height="110" rx="12" fill="#3B5A60"/>
    <text x="705" y="325" fill="#FFFDF8" font-weight="700">Decisão de</text>
    <text x="705" y="358" fill="#FFFDF8" font-weight="700">arquitetura</text>
    <path d="M1025 335 H1085" stroke="#E8C9A0" stroke-width="5" stroke-linecap="round"/>
    <path d="M1071 320 l16 15 l-16 15" fill="none" stroke="#E8C9A0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1100" y="280" width="385" height="110" rx="12" fill="#FFFDF8"/>
    <text x="1125" y="325" font-weight="700" fill="#1F2A2C">vira ADR</text>
    <text x="1125" y="360" font-size="21" fill="#6B6358">o contexto e o porquê, não só o quê</text>

    <rect x="680" y="410" width="330" height="110" rx="12" fill="#3B5A60"/>
    <text x="705" y="455" fill="#FFFDF8" font-weight="700">Regra que não</text>
    <text x="705" y="488" fill="#FFFDF8" font-weight="700">pode quebrar</text>
    <path d="M1025 465 H1085" stroke="#E8C9A0" stroke-width="5" stroke-linecap="round"/>
    <path d="M1071 450 l16 15 l-16 15" fill="none" stroke="#E8C9A0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1100" y="410" width="385" height="110" rx="12" fill="#FFFDF8"/>
    <text x="1125" y="455" font-weight="700" fill="#1F2A2C">vira checagem</text>
    <text x="1125" y="490" font-size="21" fill="#6B6358">que derruba o build</text>

    <rect x="680" y="540" width="330" height="110" rx="12" fill="#3B5A60"/>
    <text x="705" y="585" fill="#FFFDF8" font-weight="700">Comportamento</text>
    <text x="705" y="618" fill="#FFFDF8" font-weight="700">importante</text>
    <path d="M1025 595 H1085" stroke="#E8C9A0" stroke-width="5" stroke-linecap="round"/>
    <path d="M1071 580 l16 15 l-16 15" fill="none" stroke="#E8C9A0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="1100" y="540" width="385" height="110" rx="12" fill="#FFFDF8"/>
    <text x="1125" y="585" font-weight="700" fill="#1F2A2C">vira teste automatizado</text>
    <text x="1125" y="620" font-size="21" fill="#6B6358">nunca comentário</text>
  </g>
  <text x="680" y="705" font-size="22" fill="#C9D6D4">Decisão que muda depois vira entrada no registro de</text>
  <text x="680" y="735" font-size="22" fill="#C9D6D4">aprendizados, não correção silenciosa no código.</text>

  <!-- rodapé -->
  <rect x="80" y="785" width="1440" height="75" rx="14" fill="#3E7C78"/>
  <text x="800" y="833" font-size="28" font-weight="700" fill="#FFFDF8" text-anchor="middle">Programar com agente não pede menos disciplina. Pede mais.</text>
</svg>
